[package]
name = "devy"
version = "0.1.0"
description = "Devy desktop pet"
authors = ["Devy Team"]
edition = "2021"

[lib]
name = "devy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tower = { version = "0.5" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
dirs = "5"
rand = "0.8"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
] }

[profile.dev]
incremental = false
debug = 0
strip = "debuginfo"

[profile.test]
incremental = false
debug = 0
strip = "debuginfo"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
